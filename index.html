
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>RAVO PRIVÉ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f5f1e8;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;padding-bottom:90px}
header{padding:25px 20px 18px;text-align:center;border-bottom:1px solid #29251b}
.logo{font-family:Georgia,serif;font-size:29px;letter-spacing:4px;color:#d4af37}
.sub{font-size:9px;letter-spacing:4px;color:#aaa;margin-top:7px}
.hero{margin:18px;padding:28px 20px;background:linear-gradient(135deg,#242017,#0e0e0e 65%);border:1px solid #5b4923;border-radius:15px}
.hero small{color:#d4af37;letter-spacing:3px}
.hero h1{font-family:Georgia,serif;font-size:30px;font-weight:400;margin:14px 0}
.hero p{color:#aaa;font-size:13px;line-height:1.6}
.section{padding:8px 18px}
.section h2{font-family:Georgia,serif;font-weight:400;font-size:23px}
.search{margin:10px 18px 17px}
.search input{width:100%;padding:15px;border:1px solid #39332a;border-radius:10px;background:#151515;color:white;font-size:14px;outline:none}
.categories{display:flex;gap:9px;overflow:auto;padding:0 18px 15px;scrollbar-width:none}
.categories button{white-space:nowrap;border:1px solid #4c4025;background:#151515;color:#d4af37;border-radius:30px;padding:10px 15px}
.categories button.active{background:#d4af37;color:#111}
.products{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:0 15px}
.product{background:#151515;border:1px solid #29251f;border-radius:12px;overflow:hidden}
.product img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#222}
.info{padding:11px}
.brand{font-size:9px;color:#d4af37;letter-spacing:2px}
.name{font-family:Georgia,serif;font-size:16px;margin:7px 0;min-height:38px}
.price{font-size:16px;font-weight:600}
.add{width:100%;margin-top:11px;padding:11px 5px;border:0;border-radius:7px;background:#d4af37;color:#111;font-weight:700}
.empty{grid-column:1/-1;text-align:center;color:#999;padding:25px}
nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #39332a;display:flex;justify-content:space-around;padding:13px 5px calc(13px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;color:#aaa;font-size:12px}
nav button span{display:block;font-size:20px;margin-bottom:4px}
nav button.active{color:#d4af37}
#cartPanel{display:none;position:fixed;inset:0;background:#0b0b0b;z-index:10;padding:25px 18px;overflow:auto}
.cartItem{padding:14px 0;border-bottom:1px solid #333}
.cartTotal{font-size:20px;margin:25px 0}
.checkout{width:100%;padding:15px;background:#d4af37;color:#111;border:0;border-radius:9px;font-weight:bold}
.close{float:right;background:none;color:#d4af37;border:0;font-size:25px}
</style>
</head>
<body>
<header>
<div class="logo">RAVO PRIVÉ</div>
<div class="sub">THE WORLD OF FRAGRANCES</div>
</header>

<section class="hero">
<small>DISCOVER YOUR SIGNATURE</small>
<h1>Твой аромат.<br>Твои правила.</h1>
<p>Открой мир парфюмерии вместе с RAVO PRIVÉ.</p>
</section>

<div class="section"><h2>Каталог ароматов</h2></div>
<div class="search"><input id="search" placeholder="⌕  Найти аромат..." oninput="render()"></div>
<div class="categories">
<button class="active" onclick="filter('Все',this)">Все</button>
<button onclick="filter('Мужские',this)">Мужские</button>
<button onclick="filter('Женские',this)">Женские</button>
<button onclick="filter('Унисекс',this)">Унисекс</button>
</div>
<div class="products" id="products"></div>

<nav>
<button class="active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><span>⌂</span>Главная</button>
<button onclick="openCart()"><span>♧</span>Корзина <b id="count">0</b></button>
</nav>

<div id="cartPanel">
<button class="close" onclick="closeCart()">×</button>
<h2 style="font-family:Georgia,serif;font-weight:400">Моя корзина</h2>
<div id="cartItems"></div>
<div class="cartTotal" id="total"></div>
<button class="checkout" onclick="alert('Скоро подключим оформление заказа!')">ОФОРМИТЬ ЗАКАЗ</button>
</div>

<script>
const products=[
{id:1,name:"Oud Mood",brand:"LATTAFA",price:1299,category:"Унисекс",image:"https://placehold.co/500x500/191713/d4af37?text=OUD+MOOD"},
{id:2,name:"Asad",brand:"LATTAFA",price:1499,category:"Мужские",image:"https://placehold.co/500x500/191713/d4af37?text=ASAD"},
{id:3,name:"Yara",brand:"LATTAFA",price:1399,category:"Женские",image:"https://placehold.co/500x500/191713/d4af37?text=YARA"},
{id:4,name:"Club de Nuit",brand:"ARMAF",price:1899,category:"Мужские",image:"https://placehold.co/500x500/191713/d4af37?text=CLUB+DE+NUIT"}
];
let selected="Все";
let cart=[];
function render(){
const q=document.getElementById("search").value.toLowerCase();
const list=products.filter(p=>(selected==="Все"||p.category===selected)&&(p.name+" "+p.brand).toLowerCase().includes(q));
document.getElementById("products").innerHTML=list.map(p=>`
<div class="product">
<img src="${p.image}" alt="${p.name}">
<div class="info">
<div class="brand">${p.brand}</div>
<div class="name">${p.name}</div>
<div class="price">${p.price.toLocaleString("ru-RU")} ₽</div>
<button class="add" onclick="add(${p.id})">В КОРЗИНУ</button>
</div></div>`).join("")||'<div class="empty">Ничего не найдено</div>';
}
function filter(cat,el){
selected=cat;
document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
el.classList.add("active");render();
}
function add(id){
cart.push(products.find(p=>p.id===id));
document.getElementById("count").textContent=cart.length;
}
function openCart(){
document.getElementById("cartPanel").style.display="block";
document.getElementById("cartItems").innerHTML=cart.length?cart.map((p,i)=>`<div class="cartItem">${p.name} — ${p.price} ₽ <button onclick="removeItem(${i})" style="float:right;background:none;color:#d4af37;border:0">Удалить</button></div>`).join(""):"<p>Корзина пока пуста</p>";
document.getElementById("total").textContent="Итого: "+cart.reduce((s,p)=>s+p.price,0).toLocaleString("ru-RU")+" ₽";
}
function removeItem(i){cart.splice(i,1);document.getElementById("count").textContent=cart.length;openCart()}
function closeCart(){document.getElementById("cartPanel").style.display="none"}
render();
</script>
</body>
</html>
